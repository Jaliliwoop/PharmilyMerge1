<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pharmily MERGE</title>
    <style>
        /* Modern, bold font for the branding */
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,800;1,800&display=swap');

        :root { 
            --bg: #faf8ef; 
            --grid-bg: #bbada0; 
            --cell-bg: rgba(238, 228, 218, 0.35); 
            --text: #776e65; 
            --btn-bg: #8f7a66;
            --grid-size: 400px;
            --grid-gap: 15px;
            --tile-size: calc((var(--grid-size) - (var(--grid-gap) * 5)) / 4);
        }
        
        @media (max-width: 450px) {
            :root { --grid-size: 90vw; --grid-gap: 3vw; }
        }

        html, body { overflow: hidden; touch-action: none; width: 100%; height: 100%; margin: 0; position: fixed; }
        body { background: var(--bg); font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text); }
        
        .header { width: var(--grid-size); display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* THE NEW LOGO STYLE */
        .header h1 {
            margin: 0;
            font-family: 'Exo 2', sans-serif;
            font-size: clamp(24px, 8vw, 36px);
            font-weight: 800;
            font-style: italic;
            background: linear-gradient(135deg, #8f7a66 0%, #d1c4b9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.05));
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .score-container { background: #bbada0; padding: 8px 15px; border-radius: 6px; color: white; text-align: center; min-width: 80px; }
        .score-label { display: block; font-size: 10px; text-transform: uppercase; font-weight: bold; opacity: 0.9; }
        .score-val { font-size: 20px; font-weight: bold; }

        .controls { width: var(--grid-size); display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .reset-btn { background: var(--btn-bg); color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .reset-btn:active { transform: scale(0.95); }
        
        #game-container { 
            position: relative; 
            width: var(--grid-size); 
            height: var(--grid-size); 
            background: var(--grid-bg); 
            border-radius: 6px; 
            padding: var(--grid-gap); 
            box-sizing: border-box; 
        }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--grid-gap); width: 100%; height: 100%; }
        .grid-cell { background: var(--cell-bg); border-radius: 3px; }
        
        .tile-container { position: absolute; top: var(--grid-gap); left: var(--grid-gap); right: var(--grid-gap); bottom: var(--grid-gap); pointer-events: none; }
        
        .tile { 
            position: absolute; 
            width: var(--tile-size); 
            height: var(--tile-size); 
            border-radius: 3px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: calc(var(--tile-size) * 0.5); 
            font-weight: bold;
            transition: top 110ms ease-in-out, left 110ms ease-in-out; 
            z-index: 10;
        }
        
        .lvl-2 { background: #eee4da; } .lvl-4 { background: #ede0c8; }
        .lvl-8 { background: #f2b179; } .lvl-16 { background: #f59563; }
        .lvl-32 { background: #f67c5f; } .lvl-64 { background: #f65e3b; }
        .lvl-128 { background: #edcf72; box-shadow: 0 0 15px rgba(243, 215, 116, 0.4); }
        .lvl-256 { background: #edcc61; } .lvl-512 { background: #edc850; }
        .lvl-1024 { background: #edc53f; font-size: calc(var(--tile-size) * 0.4); }
        .lvl-2048 { background: #edc22e; box-shadow: 0 0 20px #edc22e; font-size: calc(var(--tile-size) * 0.4); }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 228, 218, 0.85); z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 6px; text-align: center; animation: fadeIn 0.5s ease;
        }
        #overlay h2 { font-size: 40px; margin: 0; color: #776e65; font-family: 'Exo 2', sans-serif; font-style: italic; }
        #overlay p { font-size: 18px; font-weight: bold; margin: 10px 0 20px; }
        .msg-win h2 { color: #f59e0b !important; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .tile-new { animation: appear 200ms ease; }
        .tile-merged { z-index: 20; animation: pop 200ms ease; }

        @keyframes appear { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pharmily
MERGE<span style="opacity: 0.7;">MERGE</span></h1>
        <div class="score-container">
            <span class="score-label">Score</span>
            <span id="score" class="score-val">0</span>
        </div>
    </div>

    <div class="controls">
        <button class="reset-btn" onclick="game.restart()">New Dispense</button>
    </div>
    
    <div id="game-container">
        <div class="grid">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div class="tile-container" id="tile-container"></div>
        
        <div id="overlay">
            <h2 id="status-title">Game Over!</h2>
            <p id="status-desc">Keep Dispensing...</p>
            <button class="reset-btn" onclick="game.restart()">Try Again</button>
        </div>
    </div>

<script>
class Tile {
    constructor(x, y, value) {
        this.x = x; this.y = y; this.value = value;
        this.element = this.createElement();
    }

    createElement() {
        const div = document.createElement('div');
        this.updatePosition(div);
        div.className = `tile lvl-${this.value} tile-new`;
        div.innerHTML = this.getIcon(this.value);
        document.getElementById('tile-container').appendChild(div);
        return div;
    }

    getIcon(val) {
        const icons = {2:'💊', 4:'💉', 8:'🧪', 16:'📝', 32:'🩺', 64:'👩🏻‍🔬', 128:'🧬', 256:'🏪', 512:'🏥', 1024:'🇦🇺', 2048:'🏆'};
        return icons[val] || val;
    }

    updatePosition(el = this.element) {
        const offset = `calc(${this.x} * (var(--tile-size) + var(--grid-gap)))`;
        const topOffset = `calc(${this.y} * (var(--tile-size) + var(--grid-gap)))`;
        el.style.left = offset;
        el.style.top = topOffset;
    }

    updateValue(newVal) {
        this.value = newVal;
        this.element.className = `tile lvl-${this.value} tile-merged`;
        this.element.innerHTML = this.getIcon(this.value);
    }

    remove() {
        this.element.style.opacity = '0';
        const el = this.element;
        setTimeout(() => el.remove(), 110);
    }
}

class GameEngine {
    constructor() { this.restart(); this.setupInput(); }

    restart() {
        this.board = Array(4).fill().map(() => Array(4).fill(null));
        this.score = 0;
        this.gameOver = false;
        document.getElementById('score').innerText = '0';
        document.getElementById('tile-container').innerHTML = '';
        document.getElementById('overlay').style.display = 'none';
        this.addRandomTile(); this.addRandomTile();
    }

    addRandomTile() {
        let empty = [];
        for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(!this.board[r][c]) empty.push({r,c});
        if(empty.length) {
            const {r, c} = empty[Math.floor(Math.random() * empty.length)];
            this.board[r][c] = new Tile(c, r, Math.random() < 0.9 ? 2 : 4);
        }
    }

    setupInput() {
        window.addEventListener('keydown', e => {
            if(this.gameOver) return;
            const keyMap = { 'ArrowUp':'up', 'ArrowDown':'down', 'ArrowLeft':'left', 'ArrowRight':'right' };
            if(keyMap[e.key]) { e.preventDefault(); this.move(keyMap[e.key]); }
        });

        let startX, startY;
        window.addEventListener('touchstart', e => { 
            startX = e.touches[0].clientX; startY = e.touches[0].clientY; 
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (this.gameOver || !startX || !startY) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                this.move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
            }
            startX = startY = null;
        }, {passive: false});
    }

    checkGameState() {
        for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(this.board[r][c]?.value === 2048) return this.showEndScreen(true);
        
        let hasMoves = false;
        for(let r=0; r<4; r++) {
            for(let c=0; c<4; c++) {
                if(!this.board[r][c]) { hasMoves = true; break; }
                const val = this.board[r][c].value;
                if((r<3 && this.board[r+1][c]?.value === val) || (c<3 && this.board[r][c+1]?.value === val)) { hasMoves = true; break; }
            }
        }
        if(!hasMoves) this.showEndScreen(false);
    }

    showEndScreen(win) {
        this.gameOver = true;
        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        overlay.className = win ? "msg-win" : "";
        document.getElementById('status-title').innerText = win ? "CELEBRATION! 🎉" : "GAME OVER!";
        document.getElementById('status-desc').innerText = win ? "You've reached Pharmily Elite Status!" : "The scripts have piled up.";
    }

    move(dir) {
        if(this.gameOver) return;
        const vector = { 'up':{r:-1, c:0}, 'down':{r:1, c:0}, 'left':{r:0, c:-1}, 'right':{r:0, c:1} }[dir];
        let moved = false;
        const traverse = (v) => v === 1 ? [3,2,1,0] : [0,1,2,3];
        const merged = new Set();

        traverse(vector.r).forEach(r => {
            traverse(vector.c).forEach(c => {
                const tile = this.board[r][c];
                if(tile) {
                    let curR = r, curC = c;
                    while(true) {
                        let nR = curR + vector.r, nC = curC + vector.c;
                        if(nR<0 || nR>=4 || nC<0 || nC>=4) break;
                        const next = this.board[nR][nC];
                        if(!next) {
                            this.board[nR][nC] = tile; this.board[curR][curC] = null;
                            tile.y = nR; tile.x = nC; tile.updatePosition();
                            curR = nR; curC = nC; moved = true;
                        } else if(next.value === tile.value && !merged.has(`${nR},${nC}`)) {
                            this.score += tile.value * 2;
                            document.getElementById('score').innerText = this.score;
                            next.updateValue(tile.value * 2);
                            tile.y = nR; tile.x = nC; tile.updatePosition();
                            tile.remove(); this.board[curR][curC] = null;
                            merged.add(`${nR},${nC}`); moved = true; break;
                        } else break;
                    }
                }
            });
        });
        if(moved) setTimeout(() => { this.addRandomTile(); this.checkGameState(); }, 120);
    }
}

const game = new GameEngine();
</script>
</body>
</html>
